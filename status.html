<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Complaints | Smart Complaint Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #4361ee;
  --secondary: #3a0ca3;
  --success: #4cc9f0;
  --danger: #f72585;
  --warning: #f8961e;
  --light: #f8f9fa;
  --dark: #212529;
  --gray: #6c757d;
  --pending: #ff4757;
  --in-progress: #ffa502;
  --solved: #2ed573;
  --card-shadow: 0 10px 30px rgba(0,0,0,0.12);
  --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  padding: 20px;
}

.container { max-width: 1200px; margin: 0 auto; }

header {
  text-align: center;
  margin-bottom: 40px;
  padding: 30px;
}

h1 {
  color: var(--secondary);
  margin-bottom: 15px;
  font-size: 2.5rem;
  font-weight: 700;
}

.subtitle { color: var(--gray); font-size: 1.2rem; }

.phone-box {
  background: white;
  border-radius: 20px;
  padding: 40px;
  max-width: 500px;
  margin: 0 auto 40px;
  box-shadow: var(--card-shadow);
  text-align: center;
}

.phone-box h3 { margin-bottom: 20px; color: var(--primary); }

.phone-box input {
  width: 100%;
  padding: 18px 20px;
  border: 2px solid #e9ecef;
  border-radius: 50px;
  font-size: 1.2rem;
  margin-bottom: 20px;
  text-align: center;
}

.phone-box input:focus { outline: none; border-color: var(--primary); }

.btn {
  padding: 15px 30px;
  border: none;
  border-radius: 50px;
  background: var(--gradient);
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 1.1rem;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: all 0.3s;
}

.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(67,97,238,0.3); }

.btn-secondary { background: var(--gray); }
.btn-vote-nav { background: #ff6b6b; }
.btn-vote-nav:hover { background: #ee5a24; box-shadow: 0 10px 20px rgba(255,107,107,0.3); }

.btn-vote {
  padding: 10px 20px;
  border: none;
  border-radius: 25px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
}

.btn-vote.vote {
  background: var(--gradient);
  color: white;
  box-shadow: 0 4px 15px rgba(67,97,238,0.3);
}

.btn-vote.unvote {
  background: rgba(247, 37, 133, 0.12);
  color: var(--danger);
  border: 2px solid rgba(247, 37, 133, 0.25);
}

.btn-vote:hover { 
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.btn-vote:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.stats-container {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: var(--card-shadow);
  text-align: center;
  flex: 1;
  min-width: 150px;
  cursor: pointer;
  transition: all 0.3s;
}

.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.stat-card.active {
  border: 2px solid var(--primary);
}

.stat-number { font-size: 2.5rem; font-weight: 700; }
.stat-label { color: var(--gray); }

.stat-pending { color: var(--pending); }
.stat-in-progress { color: var(--in-progress); }
.stat-solved { color: var(--solved); }
.stat-total { color: var(--secondary); }

.controls {
  display: flex;
  justify-content: space-between;
  margin-bottom: 30px;
  gap: 15px;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  max-width: 400px;
}

.search-box input {
  width: 100%;
  padding: 15px 20px;
  border: none;
  border-radius: 50px;
  box-shadow: var(--card-shadow);
  font-size: 1rem;
}

.filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

.filter-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 50px;
  background: white;
  color: var(--gray);
  font-weight: 500;
  cursor: pointer;
  box-shadow: var(--card-shadow);
  transition: all 0.3s;
}

.filter-btn.active {
  background: var(--gradient);
  color: white;
}

.filter-btn:hover:not(.active) {
  background: #f0f0f0;
}

.complaints-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 25px;
  list-style: none;
}

.complaint-card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  transition: all 0.3s;
}

.complaint-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.complaint-card.my-complaint {
  border: 2px solid var(--primary);
}

.card-header {
  padding: 20px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header.pending { background: var(--pending); }
.card-header.in-progress { background: var(--in-progress); }
.card-header.solved { background: var(--solved); }

.status-badge {
  padding: 5px 15px;
  border-radius: 30px;
  background: rgba(255,255,255,0.2);
  font-size: 0.9rem;
  font-weight: 600;
}

.card-body { padding: 20px; }

.detail-row {
  display: flex;
  margin-bottom: 12px;
}

.detail-label {
  width: 90px;
  font-weight: 500;
  color: var(--gray);
}

.detail-value {
  flex: 1;
  color: var(--dark);
}

.media-preview {
  margin-top: 15px;
}

.media-preview img {
  width: 100%;
  border-radius: 12px;
  max-height: 200px;
  object-fit: cover;
}

.vote-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #e9ecef;
  flex-wrap: wrap;
  gap: 10px;
}

.vote-count {
  font-weight: 600;
  color: var(--secondary);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.05rem;
}

.vote-count i {
  color: var(--gray);
  transition: color 0.3s;
}

.vote-count i.voted {
  color: var(--danger);
}

.empty-state {
  text-align: center;
  padding: 60px;
  background: white;
  border-radius: 20px;
  grid-column: 1 / -1;
}

.loading {
  text-align: center;
  padding: 60px;
  grid-column: 1 / -1;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #e9ecef;
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

.action-buttons {
  text-align: center;
  margin-top: 40px;
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

/* Toast notification */
.toast {
  position: fixed;
  top: 30px;
  right: 30px;
  padding: 14px 24px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1000;
  transform: translateX(120%);
  transition: transform 0.4s ease;
  max-width: 380px;
}

.toast.show { transform: translateX(0); }
.toast.success { border-left: 4px solid var(--solved); }
.toast.error { border-left: 4px solid var(--pending); }

.toast i { font-size: 1.3rem; }
.toast.success i { color: var(--solved); }
.toast.error i { color: var(--pending); }

@media (max-width: 768px) {
  .complaints-grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; align-items: stretch; }
  .search-box { max-width: 100%; }
  .filter-buttons { justify-content: center; }
  .action-buttons { flex-direction: column; align-items: center; }
  .vote-section { flex-direction: column; align-items: stretch; }
  .btn-vote { justify-content: center; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1><i class="fas fa-history"></i> My Complaint Status</h1>
    <p class="subtitle">Track all your submitted complaints</p>
  </header>
  
  <!-- Phone Input Section -->
  <div id="phoneSection" class="phone-box">
    <h3><i class="fas fa-mobile-alt"></i> Enter Your Phone Number</h3>
    <input type="tel" id="phoneInput" placeholder="10-digit mobile number" maxlength="10" value="">
    <button class="btn" id="viewComplaintsBtn">
      <i class="fas fa-search"></i> View My Complaints
    </button>
    <p style="margin-top: 15px; color: var(--gray); font-size: 0.9rem;">
      Enter the phone number you used when submitting complaints
    </p>
  </div>
  
  <!-- Dashboard Content -->
  <div id="dashboardSection" class="hidden">
    <div class="stats-container" id="statsContainer"></div>
    
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search complaints...">
      </div>
      
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Pending">Pending</button>
        <button class="filter-btn" data-filter="In Progress">In Progress</button>
        <button class="filter-btn" data-filter="Solved">Resolved</button>
      </div>
      
      <button class="btn" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
    
    <ul class="complaints-grid" id="complaintsList"></ul>
    
    <div class="action-buttons">
      <button class="btn btn-secondary" id="changePhoneBtn">
        <i class="fas fa-phone-alt"></i> Change Phone
      </button>
      <button class="btn btn-vote-nav" id="goToVoteBtn">
        <i class="fas fa-vote-yea"></i> Go to Vote
      </button>
      <button class="btn" onclick="window.location.href='form.html'">
        <i class="fas fa-plus-circle"></i> New Complaint
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
  <i id="toastIcon" class="fas fa-check-circle"></i>
  <span id="toastMessage">Success!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase Configuration
  const SUPABASE_URL = "https://vbxvxqxzdhloklxrcgvb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZieHZ4cXh6ZGhsb2tseHJjZ3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTI4NDcsImV4cCI6MjA5MDI4ODg0N30.arjQZaDWHBt3E8IffvaRE07pWbCC6-RSvLHK2uLmHsU";
  
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log("✅ Supabase client initialized");

  // DOM Elements
  const phoneSection = document.getElementById('phoneSection');
  const dashboardSection = document.getElementById('dashboardSection');
  const phoneInput = document.getElementById('phoneInput');
  const viewBtn = document.getElementById('viewComplaintsBtn');
  const goToVoteBtn = document.getElementById('goToVoteBtn');
  const complaintsList = document.getElementById('complaintsList');
  const statsContainer = document.getElementById('statsContainer');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn = document.getElementById('refreshBtn');
  const changePhoneBtn = document.getElementById('changePhoneBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const toast = document.getElementById('toast');
  const toastMessage = document.getElementById('toastMessage');
  const toastIcon = document.getElementById('toastIcon');

  // State
  let allComplaints = [];
  let currentFilter = 'all';
  let currentPhone = '';
  let userVotes = {};
  let isLoading = false;

  // Load saved phone
  const savedPhone = localStorage.getItem('userPhone');
  if (savedPhone) {
    phoneInput.value = savedPhone;
    console.log("📱 Loaded saved phone:", savedPhone);
  }

  // Toast function
  function showToast(message, type = 'success') {
    toast.className = `toast ${type}`;
    toastIcon.className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
    toastMessage.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // View Complaints Button
  viewBtn.addEventListener('click', async () => {
    const phone = phoneInput.value.trim();
    console.log("🔍 View complaints clicked for:", phone);
    
    if (!/^\d{10}$/.test(phone)) {
      alert('Please enter a valid 10-digit phone number');
      return;
    }
    
    currentPhone = phone;
    localStorage.setItem('userPhone', phone);
    
    phoneSection.classList.add('hidden');
    dashboardSection.classList.remove('hidden');
    
    await loadUserVotes(phone);
    await loadComplaints(phone);
  });

  // Go to Vote Button
  goToVoteBtn.addEventListener('click', () => {
    if (currentPhone) {
      localStorage.setItem('userPhone', currentPhone);
      window.location.href = 'vote.html';
    } else {
      showToast('Please load your complaints first.', 'error');
    }
  });

  // Change Phone Button
  changePhoneBtn.addEventListener('click', () => {
    phoneSection.classList.remove('hidden');
    dashboardSection.classList.add('hidden');
  });

  // Refresh Button
  refreshBtn.addEventListener('click', () => {
    if (currentPhone) {
      loadUserVotes(currentPhone);
      loadComplaints(currentPhone);
    }
  });

  // Search Input
  searchInput.addEventListener('input', filterComplaints);

  // Filter Buttons
  filterBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      filterBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      filterComplaints();
    });
  });

  // Load user votes from localStorage
  async function loadUserVotes(phone) {
    try {
      const savedVotes = localStorage.getItem(`userVotes_${phone}`);
      if (savedVotes) {
        userVotes = JSON.parse(savedVotes);
        console.log("📊 Loaded user votes from localStorage:", Object.keys(userVotes).length);
      }
      
      // Also try to get from complaint_votes table
      try {
        const { data, error } = await supabaseClient
          .from("complaint_votes")
          .select("complaint_id")
          .eq("user_phone", phone);
          
        if (!error && data) {
          const dbVotes = {};
          data.forEach(item => {
            dbVotes[item.complaint_id] = true;
          });
          userVotes = { ...userVotes, ...dbVotes };
          localStorage.setItem(`userVotes_${phone}`, JSON.stringify(userVotes));
          console.log("📊 Synced with database:", Object.keys(userVotes).length);
        }
      } catch (e) {
        console.log("Using localStorage only for votes");
      }
    } catch (error) {
      console.error("Error loading user votes:", error);
      userVotes = {};
    }
  }

  // Toggle vote
  async function toggleVote(complaintId, buttonElement) {
    if (isLoading) return;
    
    try {
      const complaint = allComplaints.find(c => c.id === complaintId);
      if (!complaint) {
        console.error("Complaint not found:", complaintId);
        return;
      }

      isLoading = true;
      if (buttonElement) {
        buttonElement.disabled = true;
        buttonElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
      }

      const hasVoted = userVotes[complaintId];

      // Try using complaint_votes table first
      try {
        if (hasVoted) {
          const { error } = await supabaseClient
            .from("complaint_votes")
            .delete()
            .eq("complaint_id", complaintId)
            .eq("user_phone", currentPhone);
          if (error) throw error;
          complaint.votes = Math.max(0, (complaint.votes || 0) - 1);
          delete userVotes[complaintId];
        } else {
          const { error } = await supabaseClient
            .from("complaint_votes")
            .insert({ complaint_id: complaintId, user_phone: currentPhone });
          if (error) throw error;
          complaint.votes = (complaint.votes || 0) + 1;
          userVotes[complaintId] = true;
        }
      } catch (e) {
        // Fallback: update complaints table directly
        console.log("Using fallback voting method");
        let newVotes = hasVoted ? Math.max(0, (complaint.votes || 0) - 1) : (complaint.votes || 0) + 1;
        
        let votedUsers = complaint.voted_users || [];
        if (!Array.isArray(votedUsers)) {
          try {
            votedUsers = JSON.parse(votedUsers || '[]');
          } catch {
            votedUsers = [];
          }
        }
        
        if (hasVoted) {
          votedUsers = votedUsers.filter(id => id !== currentPhone);
        } else {
          if (!votedUsers.includes(currentPhone)) {
            votedUsers.push(currentPhone);
          }
        }

        const { error } = await supabaseClient
          .from("complaints")
          .update({ 
            votes: newVotes,
            voted_users: votedUsers
          })
          .eq("id", complaintId);

        if (error) throw error;
        complaint.votes = newVotes;
        complaint.voted_users = votedUsers;
        
        if (hasVoted) delete userVotes[complaintId];
        else userVotes[complaintId] = true;
      }

      // Save to localStorage
      localStorage.setItem(`userVotes_${currentPhone}`, JSON.stringify(userVotes));
      
      // Re-render
      filterComplaints();
      updateStats();
      showToast(hasVoted ? "Vote removed successfully!" : "Vote added successfully!");

    } catch (error) {
      console.error("Error toggling vote:", error);
      showToast("Error updating vote. Please try again.", "error");
    } finally {
      isLoading = false;
    }
  }

  // Load complaints from Supabase
  async function loadComplaints(phone) {
    console.log("📥 Loading complaints for:", phone);
    
    complaintsList.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading complaints...</p></div>';
    
    try {
      const { data, error } = await supabaseClient
        .from('complaints')
        .select('*')
        .eq('phone', phone)
        .order('created_at', { ascending: false });
      
      console.log("📊 Supabase response:", { data, error });
      
      if (error) throw error;
      
      allComplaints = data || [];
      console.log(`✅ Found ${allComplaints.length} complaints`);
      
      if (allComplaints.length === 0) {
        complaintsList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox" style="font-size:4rem;color:#ddd;"></i><h3>No Complaints Found</h3><p>No complaints found for this phone number.</p></div>';
        statsContainer.innerHTML = '';
      } else {
        updateStats();
        filterComplaints();
      }
    } catch (error) {
      console.error("❌ Error loading complaints:", error);
      complaintsList.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="font-size:4rem;color:var(--danger);"></i><h3>Error</h3><p>${error.message}</p></div>`;
    }
  }

  // Update statistics
  function updateStats() {
    const total = allComplaints.length;
    const pending = allComplaints.filter(c => (c.status || 'Pending').toLowerCase() === 'pending').length;
    const inProgress = allComplaints.filter(c => (c.status || '').toLowerCase() === 'in progress').length;
    const solved = allComplaints.filter(c => {
      const s = (c.status || '').toLowerCase();
      return s === 'solved' || s === 'resolved';
    }).length;
    
    statsContainer.innerHTML = `
      <div class="stat-card ${currentFilter === 'all' ? 'active' : ''}" onclick="currentFilter='all';filterComplaints();">
        <div class="stat-number stat-total">${total}</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card ${currentFilter === 'Pending' ? 'active' : ''}" onclick="currentFilter='Pending';filterComplaints();">
        <div class="stat-number stat-pending">${pending}</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card ${currentFilter === 'In Progress' ? 'active' : ''}" onclick="currentFilter='In Progress';filterComplaints();">
        <div class="stat-number stat-in-progress">${inProgress}</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card ${currentFilter === 'Solved' ? 'active' : ''}" onclick="currentFilter='Solved';filterComplaints();">
        <div class="stat-number stat-solved">${solved}</div>
        <div class="stat-label">Resolved</div>
      </div>
    `;
  }

  // Render complaints
  function renderComplaints(complaints) {
    if (complaints.length === 0) {
      complaintsList.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>No matches</h3><p>No complaints match your filter.</p></div>';
      return;
    }
    
    complaintsList.innerHTML = complaints.map(complaint => {
      const status = complaint.status || 'Pending';
      const statusClass = status.toLowerCase().replace(/\s+/g, '-');
      const isMyComplaint = complaint.phone === currentPhone;
      const hasVoted = userVotes[complaint.id] || false;
      const voteCount = complaint.votes || 0;
      
      return `
        <li class="complaint-card ${isMyComplaint ? 'my-complaint' : ''}">
          <div class="card-header ${statusClass}">
            <h3 style="font-size:1.1rem;">${complaint.department || 'General'} ${isMyComplaint ? ' <i class="fas fa-user" title="Your Complaint"></i>' : ''}</h3>
            <span class="status-badge"><i class="fas fa-${status === 'Pending' ? 'clock' : status === 'In Progress' ? 'tools' : 'check-circle'}"></i> ${status}</span>
          </div>
          <div class="card-body">
            <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${complaint.name || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${complaint.phone}</div></div>
            <div class="detail-row"><div class="detail-label">Date:</div><div class="detail-value">${formatDate(complaint.created_at)}</div></div>
            <div class="detail-row"><div class="detail-label">Location:</div><div class="detail-value">${complaint.location || '—'}</div></div>
            <div class="detail-row"><div class="detail-label">Details:</div><div class="detail-value">${complaint.details || '—'}</div></div>
            ${complaint.photo ? `<div class="media-preview"><img src="${complaint.photo}" alt="Evidence"></div>` : ''}
            ${complaint.remarks ? `<div style="margin-top:15px;padding:12px;background:#f8f9fa;border-radius:10px;"><strong>Remarks:</strong> ${complaint.remarks}</div>` : ''}
            
            <div class="vote-section">
              <div class="vote-count">
                <i class="fas fa-heart ${hasVoted ? 'voted' : ''}"></i>
                ${voteCount} ${voteCount === 1 ? 'Vote' : 'Votes'}
              </div>
              <button class="btn-vote ${hasVoted ? 'unvote' : 'vote'}" 
                      onclick="toggleVote('${complaint.id}', this)"
                      id="voteBtn_${complaint.id}">
                <i class="fas ${hasVoted ? 'fa-thumbs-down' : 'fa-thumbs-up'}"></i>
                ${hasVoted ? 'Unvote' : 'Vote'}
              </button>
            </div>
          </div>
        </li>
      `;
    }).join('');
  }

  // Filter complaints
  function filterComplaints() {
    const searchTerm = searchInput.value.toLowerCase();
    
    const filtered = allComplaints.filter(complaint => {
      const matchesSearch = 
        (complaint.department || '').toLowerCase().includes(searchTerm) ||
        (complaint.details || '').toLowerCase().includes(searchTerm) ||
        (complaint.name || '').toLowerCase().includes(searchTerm) ||
        (complaint.location || '').toLowerCase().includes(searchTerm);
      
      const status = (complaint.status || 'Pending').toLowerCase();
      const matchesFilter = currentFilter === 'all' || status === currentFilter.toLowerCase();
      
      return matchesSearch && matchesFilter;
    });
    
    renderComplaints(filtered);
  }

  // Helper: Format date
  function formatDate(dateString) {
    if (!dateString) return 'N/A';
    const date = new Date(dateString);
    return date.toLocaleDateString('en-IN', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  }

  // Auto-load if phone exists
  if (savedPhone) {
    setTimeout(() => {
      viewBtn.click();
    }, 500);
  }

  console.log("✅ Status page with voting enabled for all complaints!");
</script>
</body>
</html>
